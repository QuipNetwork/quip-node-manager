# GitLab CI/CD for Quip Node Manager
# Tauri v2 desktop app builds for macOS (universal), Linux, Windows

stages:
  - toolchain
  - lint
  - build
  - sign
  - release

# Pull vendor/nodes.quip.network (docker-compose.yml + Caddyfile bundled
# as Tauri resources) before any job runs. Default is `none`, which would
# leave the submodule dir empty and fail the Tauri resource-path check.
# Toolchain image for build-linux-x86_64, built from
# .gitlab/ci-toolchain.Dockerfile by the `build-toolchain-image` job below and
# published to this project's own registry. Unlike the validator's toolchain
# image — which lives on Docker Hub and must be pushed by hand, because no
# Docker Hub credentials exist in CI — every job here is already authenticated
# to $CI_REGISTRY through the job token, so CI builds and pushes it itself.
#
# TOOLCHAIN_IMAGE is pinned by digest, not by tag: a tag can be re-pushed to
# point at different content, which would change what every Linux build runs
# with no diff in this repo. Changing the Dockerfile is therefore two steps —
# let `build-toolchain-image` publish, then bump the digest here. The job
# prints the digest it pushed.
#
# The macOS and Windows jobs run on shell runners, which ignore `image:`
# entirely, so they keep installing their own toolchains in before_script.
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  TOOLCHAIN_IMAGE: $CI_REGISTRY_IMAGE/ci-toolchain@sha256:5188558d319c6300a7aba885b2db430e3b6d0b7ebdfddbd7a1d940d1feefc15b
  TOOLCHAIN_CACHE_IMAGE: $CI_REGISTRY_IMAGE/ci-toolchain-buildcache
  # Keep the Rust build directory and the Cargo home across jobs.
  #
  # The default -ffdx deleted both at the start of every job, and a cache then
  # spent the next 38s restoring what had just been deleted and 122s zipping it
  # again at the end. On a 108s macOS build that was 160s of the 276s total, to
  # rebuild state the runner had already had on disk. The cache never left the
  # machine either ("Cache will be stored only locally"), so it carried nothing
  # between runners and only paid to zip ~39,000 small files.
  #
  # Excluding these two paths from the clean removes both halves. Each build
  # job clears its own output directory first, so a stale bundle cannot survive
  # into a later run.
  GIT_CLEAN_FLAGS: -ffdx -e src-tauri/target -e .cargo-cache

# ---------------------------------------------------------------------------
# Toolchain image
# ---------------------------------------------------------------------------

# Rebuilds the Linux build environment. Runs automatically only when the
# Dockerfile changes, and is available as a manual job otherwise (to refresh
# the pinned Rust or bun version, or to recover a deleted tag).
#
# Not a dependency of build-linux-x86_64, and deliberately so: that job
# consumes a pinned digest, which by definition names an image that already
# exists. Wiring them together in one pipeline would mean the consumer waits
# on a rebuild it cannot use until the digest is bumped.
build-toolchain-image:
  stage: toolchain
  needs: []
  # `docker` pins this to a container executor, which honours `image:` and can
  # run kaniko. lovelace, finney and watch all carry docker + amd64; the macOS
  # shell runners ignore `image:` and cannot run it. The executor comes from
  # the group's own digest-pinned mirror of the upstream kaniko image, which
  # the validator maintains — the -debug flavor is required because GitLab's
  # before_script needs a shell.
  image:
    name: registry.gitlab.com/quip.network/kaniko/executor:v1.25.17-debug@sha256:d53c54f94bf0a0733f0976a06b503814bf23f4ebc75a9b75ad683a3f528a366f
    entrypoint: [""]
  tags: [docker, amd64]
  variables:
    # The Dockerfile needs no repository content, so the context is .gitlab/
    # rather than the whole checkout.
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - .gitlab/ci-toolchain.Dockerfile
    - when: manual
      allow_failure: true
  before_script:
    # lovelace and finney are NVIDIA GPU hosts that bind-mount host firmware
    # into /lib, so kaniko must ignore that path; ignoring it drops the
    # multilib directory, which this restores for the amd64 triplet. Copied
    # from the validator, where the same three runners need the same fix.
    - mkdir -p /lib && ln -sfn /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    # :latest is what a human pulls to reproduce a build locally; the
    # commit-tagged copy is what makes an old digest traceable to a source
    # revision after :latest has moved on.
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/.gitlab" \
        --dockerfile "$CI_PROJECT_DIR/.gitlab/ci-toolchain.Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE/ci-toolchain:latest" \
        --destination "$CI_REGISTRY_IMAGE/ci-toolchain:$CI_COMMIT_SHORT_SHA" \
        --cache=true \
        --cache-repo "$TOOLCHAIN_CACHE_IMAGE" \
        --ignore-path=/lib \
        --digest-file=/tmp/digest
    - echo "Pin this in TOOLCHAIN_IMAGE::$CI_REGISTRY_IMAGE/ci-toolchain@$(cat /tmp/digest)"

# ---------------------------------------------------------------------------
# Shared setup
# ---------------------------------------------------------------------------

.tauri_build:
  stage: build
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-cache"
  # Serialized per platform across every pipeline in the project. GIT_CLEAN_FLAGS
  # deliberately preserves src-tauri/target between jobs, which is what keeps the
  # compile warm — but a runner has one such directory, and each build job starts
  # by clearing its own output from it. Two pipelines overlapping therefore had
  # one job deleting a file the other held open:
  #
  #   $ Remove-Item -Force -ErrorAction SilentlyContinue src-tauri\target\release\quip-node-manager.exe
  #   ERROR: Job failed: exit status 1
  #
  # -ErrorAction SilentlyContinue does not save it: the PowerShell executor fails
  # the job on the error stream regardless. This failed the Windows job on both
  # the v0.2.5-rc3 and v0.2.5-rc4 release tags, and merging an MR is enough to
  # cause it — the merge starts a main pipeline, and a tag pushed after it adds a
  # third. Overlapping pipelines now queue instead of corrupting each other.
  #
  # Each concrete job sets its own group, because the directory is shared per
  # platform, not across platforms.
  #
  # macOS was initially left out, on the grounds it clears a different bundle
  # path and had never been seen to collide. It collides. Three jobs landed on
  # tesla-arm inside two minutes while testing QUI-1295, and the third hung for
  # the full hour in `get_sources` — a git fetch blocked on a sibling job's
  # working copy, which never reaches before_script and so reports nothing more
  # useful than a job timeout.
  artifacts:
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    # .gitlab-ci.yml is deliberately absent: a change to it rebuilt the whole
    # app on all three runners for no result. The bundles a branch produces are
    # unsigned and discarded, and the signing path is reached only under
    # CI_COMMIT_TAG, so a branch build cannot exercise a change to it. Tags
    # match the first rule and still build everything.
    - if: $CI_COMMIT_BRANCH
      changes:
        - src/**/*
        - src-tauri/**/*
        - package.json
        - bun.lock

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

# Without this gate the repository accumulated formatting drift, so anyone who
# ran the formatter while fixing something unrelated got a diff spanning a
# dozen files they never touched. Checking it here keeps that at zero.
#
# Tracks floating stable, like every other job. A new stable rustfmt can
# therefore fail this on unchanged code; the fix is to run the formatter, not
# to pin, since nothing else in this file pins either.
rustfmt:
  stage: lint
  image: rust:slim
  variables:
    # rustfmt parses the crate but never builds it, so the vendored submodule
    # and its Tauri resources are not needed.
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    # The official rust images install with rustup's minimal profile, which
    # leaves rustfmt out.
    - rustup component add rustfmt
  script:
    - cargo fmt --manifest-path src-tauri/Cargo.toml --check
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      changes:
        - src-tauri/**/*
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# macOS Universal (ARM64 + x86_64 fat binary)
# ---------------------------------------------------------------------------

build-macos-universal:
  extends: .tauri_build
  resource_group: macos-build
  tags: [macos, arm64]
  before_script:
    - export PATH="$HOME/.homebrew/opt/rustup/bin:$HOME/.homebrew/bin:/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.bun/bin:$CARGO_HOME/bin:$PATH"
    # Tauri creates one temporary keychain per signed build and deletes the
    # file when the build succeeds, but never updates the search list, so a
    # crashed or killed build (or, apparently, the OS reclaiming the file on
    # its own) leaves a dangling path behind. roman-mac-native had four such
    # entries with no default keychain configured, and codesign reported "no
    # identity found" for a certificate a fresh keychain had just reported
    # imported. `security delete-keychain` cannot clear these — the file is
    # already gone, so it errors "could not be found" and leaves the search
    # list untouched. Rebuild the list from only the entries whose file
    # still exists, so dangling entries never accumulate. The list is a
    # per-account preference, so it is rewritten only when an entry was
    # actually dropped; a clean runner sees no write at all.
    - |
      keep=""
      dropped=0
      for kc in $(security list-keychains -d user | tr -d '" '); do
        if [ -f "$kc" ]; then
          keep="$keep $kc"
        else
          echo "dropping dangling keychain reference: $kc"
          dropped=1
        fi
      done
      # Each surviving path must be its own argument, hence no quotes.
      # shellcheck disable=SC2086
      [ "$dropped" -eq 0 ] || security list-keychains -d user -s $keep
    # The [macos, arm64] tags match more than one runner, and they are not
    # provisioned alike: one carries rustup, another answers `command not
    # found` and fails the job at exit 127. Whichever runner picks up the job
    # decides whether the build starts, so install the toolchain when it is
    # absent. rustup-init writes into CARGO_HOME, which the PATH above
    # already covers.
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        echo "rustup not found on this runner, installing the stable toolchain"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
          sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      fi
    - rustup default stable 2>/dev/null || true
    - rustup target add x86_64-apple-darwin
    - curl -fsSL https://bun.sh/install | bash || true
    - bun install
  script:
    - export PATH="$HOME/.homebrew/opt/rustup/bin:$HOME/.homebrew/bin:/opt/homebrew/opt/rustup/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.bun/bin:$CARGO_HOME/bin:$PATH"
    - rm -rf src-tauri/target/universal-apple-darwin/release/bundle
    # Load the signing identity into a keychain this job owns, rather than
    # letting Tauri build one from APPLE_CERTIFICATE.
    #
    # Tauri's own path works only on a runner that already has the Developer ID
    # in its login keychain: it imports the certificate, reports "1 identity
    # imported", and then `codesign` answers "no identity found" for that exact
    # identity. roman-mac-native has no default keychain and no identity of its
    # own, so it failed every signed build while tesla-arm passed. The
    # difference was the runner's pre-existing setup, not the build.
    #
    # Doing it here makes both runners behave the same. The partition list must
    # name codesign: explicitly — without it macOS wants to prompt for access to
    # the private key, and a prompt nobody can answer surfaces as exactly the
    # same "no identity found".
    #
    # APPLE_CERTIFICATE is then unset on purpose: Tauri only creates its
    # temporary keychain when it is present, and with the identity already
    # loaded that step has nothing left to do.
    #
    # The job keychain is never made the default keychain and never added to
    # the user's search list. Both are per-account preferences that outlive
    # the job, and an earlier version of this block set both and restored
    # neither, so every developer machine acting as a runner was left with
    # quip-ci as its default keychain. Every `security` call below names the
    # keychain with -k; codesign is covered by the wrapper in CODESIGN_WRAPPER
    # (see the build step), which passes --keychain on every invocation.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        export APPLE_API_KEY_PATH="$APPLE_API_KEY_FILE"

        KEYCHAIN="$HOME/Library/Keychains/quip-ci.keychain-db"
        KEYCHAIN_PW=$(openssl rand -base64 24)
        CERT_DIR=$(mktemp -d -t quip-cert)
        CERT_DIR_CA=$(mktemp -d -t quip-ca)
        CODESIGN_WRAPPER=$(mktemp -d -t quip-codesign)
        CERT_P12="$CERT_DIR/cert.p12"
        trap 'rm -rf "$CERT_DIR" "$CERT_DIR_CA" "$CODESIGN_WRAPPER"' EXIT

        security delete-keychain "$KEYCHAIN" 2>/dev/null || true
        security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        # 6h lock timeout, far longer than a build: a keychain that relocks
        # mid-build fails the same way.
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

        # openssl rather than base64(1): the BSD base64 on macOS does not take
        # GNU's --decode, and with no decode flag it encodes instead of
        # decoding, silently, so `security import` was handed base64 of base64.
        printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$CERT_P12"
        # A PKCS#12 is DER, so it opens with a SEQUENCE tag, 0x30. Decoding a
        # value that was not base64 in the first place leaves ASCII here, which
        # is exactly how the earlier double-encoding showed up. Checking the tag
        # rather than parsing the bundle keeps this independent of OpenSSL's
        # version: 3.x refuses Apple's legacy-encrypted exports without
        # -legacy, so parsing rejects certificates that import perfectly well.
        if [ "$(head -c 1 "$CERT_P12" | od -An -tx1 | tr -d '[:space:]')" != "30" ]; then
          echo "APPLE_CERTIFICATE did not decode to DER ($(wc -c < "$CERT_P12") bytes)" >&2
          echo "it must hold the base64 of the .p12 export" >&2
          exit 1
        fi
        # -f pkcs12 is required, not tidiness: with no -f, security picks the
        # format from the file name, and a mktemp name ends in a random
        # extension it does not know. It never looks at the bytes, so a valid
        # bundle came back as "SecKeychainItemImport: Unknown format in import".
        security import "$CERT_P12" -f pkcs12 -k "$KEYCHAIN" \
          -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm -rf "$CERT_DIR"

        # A Developer ID leaf chains through Apple's Developer ID
        # Certification Authority to the Apple Root CA. The root ships in
        # System Roots, but the intermediate arrives with Xcode. A runner with
        # only the Command Line Tools has no copy, so the chain cannot be
        # built and the certificate counts as invalid however well it
        # imported. That is the difference between the two runners: tesla-arm
        # holds one in its login keychain, roman-mac-native holds nothing.
        #
        # Non-fatal: if the identity turns out to be usable anyway, the check
        # below says so, and it gives the real verdict either way.
        for ca in DeveloperIDG2CA DeveloperIDCA; do
          if curl -fsS --max-time 30 -o "$CERT_DIR_CA/$ca.cer" \
            "https://www.apple.com/certificateauthority/$ca.cer"; then
            security add-certificates -k "$KEYCHAIN" "$CERT_DIR_CA/$ca.cer" 2>/dev/null \
              || security import "$CERT_DIR_CA/$ca.cer" -k "$KEYCHAIN" 2>/dev/null \
              || echo "note: $ca was not added" >&2
          else
            echo "note: $ca could not be downloaded" >&2
          fi
        done
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

        # Point codesign at the job keychain explicitly.
        #
        # Tauri passes --keychain to codesign only when it built the keychain
        # itself from APPLE_CERTIFICATE. On the identity-only path used here
        # it runs a bare `codesign -s <identity>`, which resolves the identity
        # through the user's keychain search list. Registering the job
        # keychain there is a per-account preference write, and the one thing
        # this job must not do. Tauri spawns `codesign` by name through PATH,
        # so a wrapper ahead of it on PATH adds --keychain to every call and
        # hands off to the real binary. The exec keeps the keychain's access
        # control intact: the ACL set by `security import -T` names
        # /usr/bin/codesign, and that is still the process that touches the
        # key. The wrapper is on PATH only for the build step; the signing
        # verification that follows uses the stock binary.
        printf '#!/bin/sh\nexec /usr/bin/codesign --keychain "%s" "$@"\n' "$KEYCHAIN" \
          > "$CODESIGN_WRAPPER/codesign"
        chmod +x "$CODESIGN_WRAPPER/codesign"

        # Gate on the identity being present, not on macOS calling it valid.
        #
        # An identity is a certificate plus its private key. `-v` adds a full
        # trust evaluation on top, and on roman-mac-native that evaluation
        # returns 0 while the keychain holds the key and the whole chain:
        #
        #   certificates in keychain: 3
        #   1) BFEE... "Developer ID Application: ..."   1 identities found
        #   Valid identities only                        0 valid identities found
        #
        # Signing does not need that evaluation to pass, and gating on it
        # blocked a runner that has everything signing requires. The real
        # check is verify-macos-signing.sh after the build: it reads the
        # notarization ticket and the authority chain off the finished DMG, so
        # a chain that genuinely cannot be built fails there, on evidence,
        # rather than here on a proxy for it.
        if ! security find-identity -p codesigning "$KEYCHAIN" | grep -q "$APPLE_SIGNING_IDENTITY"; then
          echo "the signing identity is not in this runner's keychain" >&2
          echo "wanted: $APPLE_SIGNING_IDENTITY" >&2
          echo "certificates in keychain: $(security find-certificate -a "$KEYCHAIN" 2>/dev/null | grep -c '^keychain:')" >&2
          security find-identity -p codesigning "$KEYCHAIN" >&2 || true
          echo "certificates present but no identity means the .p12 carried no private key." >&2
          exit 1
        fi
        # Informational: record why the trust evaluation is unhappy, without
        # blocking on it. Nothing here may fail the job.
        if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$APPLE_SIGNING_IDENTITY"; then
          echo "note: the identity is present but does not pass trust evaluation" >&2
          security find-certificate -c "Developer ID Application" -p "$KEYCHAIN" \
            > "$CERT_DIR_CA/leaf.pem" 2>/dev/null || true
          security verify-cert -c "$CERT_DIR_CA/leaf.pem" -p codeSign -k "$KEYCHAIN" >&2 2>&1 || true
          openssl x509 -in "$CERT_DIR_CA/leaf.pem" -noout -dates -issuer >&2 2>/dev/null || true
          security list-keychains >&2 2>&1 || true
          echo "note: continuing; verify-macos-signing.sh gates the finished DMG" >&2
        fi
        unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
      else
        unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
        unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
      fi
    # CODESIGN_WRAPPER is set only on a tag build; the expansion is empty
    # otherwise and PATH is unchanged.
    - PATH="${CODESIGN_WRAPPER:+$CODESIGN_WRAPPER:}$PATH" bun run tauri build --target universal-apple-darwin
    - mkdir -p dist
    - cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/quip-node-manager-macos-universal.dmg
    # Tauri does not notarize the DMG, and it treats absent credentials as a
    # warning rather than an error, so a tag build proves nothing until these
    # two scripts have run.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
              -maxdepth 1 -name '*.app' | head -1)
        if [ -z "$APP" ]; then
          echo "no .app bundle found after the build" >&2
          exit 1
        fi
        ./scripts/notarize-dmg.sh dist/quip-node-manager-macos-universal.dmg
        ./scripts/verify-macos-signing.sh "$APP" dist/quip-node-manager-macos-universal.dmg
      fi
  # Runs after success, failure, and cancellation. The job keychain holds the
  # private key from APPLE_CERTIFICATE, so it must not outlive the job; an
  # untagged build never created it and the delete is a no-op.
  after_script:
    - security delete-keychain "$HOME/Library/Keychains/quip-ci.keychain-db" 2>/dev/null || true
  artifacts:
    paths:
      - dist/quip-node-manager-macos-universal.dmg

# ---------------------------------------------------------------------------
# Linux x86_64 (AppImage + deb)
# ---------------------------------------------------------------------------

build-linux-x86_64:
  extends: .tauri_build
  resource_group: linux-build
  # The toolchain image carries the GTK/WebKit system libraries, Rust, and bun
  # (see .gitlab/ci-toolchain.Dockerfile). They used to be installed per job on
  # a stock ubuntu:22.04, which re-paid an apt-get of ~120 packages plus two
  # installer downloads on every run — 40 minutes of it under contention, none
  # of which GIT_CLEAN_FLAGS could preserve, since only the project directory
  # survives a job and none of that setup lands there.
  image: $TOOLCHAIN_IMAGE
  tags: [linux, x86_64]
  before_script:
    - bun install
  script:
    - rm -rf src-tauri/target/release/bundle
    - bun run tauri build
    - mkdir -p dist
    - cp src-tauri/target/release/bundle/appimage/*.AppImage dist/quip-node-manager-linux-x86_64.AppImage
    - cp src-tauri/target/release/bundle/deb/*.deb dist/quip-node-manager-linux-x86_64.deb
    - |
      cat > dist/README-linux.txt << 'HEREDOC'
      Quip Node Manager — Linux

      AppImage (any distro):
        chmod +x quip-node-manager-linux-x86_64.AppImage
        ./quip-node-manager-linux-x86_64.AppImage
        # Add --cli for terminal UI mode

      Debian/Ubuntu (.deb):
        sudo dpkg -i quip-node-manager-linux-x86_64.deb
        quip-node-manager
        # Add --cli for terminal UI mode
      HEREDOC
  artifacts:
    paths:
      - dist/quip-node-manager-linux-x86_64.AppImage
      - dist/quip-node-manager-linux-x86_64.deb
      - dist/README-linux.txt

# ---------------------------------------------------------------------------
# Windows x86_64
# ---------------------------------------------------------------------------

build-windows-x86_64:
  extends: .tauri_build
  resource_group: windows-build
  tags: [windows, x86_64]
  variables:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "core.longPaths"
    GIT_CONFIG_VALUE_0: "true"
  before_script:
    - git config core.longPaths true
    - $env:Path = "C:\ProgramData\chocolatey\bin;C:\Program Files\NSIS;C:\Program Files\nodejs;$env:USERPROFILE\.cargo\bin;$env:Path"
    - choco install nodejs-lts rust-ms nsis vcredist140 -y --no-progress
    - $env:Path = "C:\ProgramData\chocolatey\bin;C:\Program Files\NSIS;C:\Program Files\nodejs;$env:USERPROFILE\.cargo\bin;$env:Path"
    - if (-not (Get-Command bun -ErrorAction SilentlyContinue)) { npm install -g bun }
    - $env:Path = "$env:APPDATA\npm;$env:USERPROFILE\.bun\bin;$env:Path"
    - bun install
  script:
    - $env:Path = "C:\ProgramData\chocolatey\bin;C:\Program Files\NSIS;C:\Program Files\nodejs;$env:APPDATA\npm;$env:USERPROFILE\.bun\bin;$env:USERPROFILE\.cargo\bin;$env:Path"
    # target/ now survives between jobs, so drop the previous binary rather
    # than risk copying it when a build produces nothing.
    - Remove-Item -Force -ErrorAction SilentlyContinue src-tauri\target\release\quip-node-manager.exe
    - bun run tauri build -- --no-bundle
    - New-Item -ItemType Directory -Force -Path dist
    - Copy-Item src-tauri\target\release\quip-node-manager.exe dist\quip-node-manager-windows-x86_64.exe
  artifacts:
    paths:
      - dist/quip-node-manager-windows-x86_64.exe
  # .tauri_build's rules plus the signing scripts: sign-windows-x86_64 needs
  # this job's artifact, and a branch that changes only a script would
  # otherwise schedule the sign job with nothing to sign, which GitLab
  # rejects at pipeline creation ("needs job not in pipeline").
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      changes:
        - src/**/*
        - src-tauri/**/*
        - package.json
        - bun.lock
        - scripts/sign-windows.sh
        - scripts/verify-windows-signing.sh

# ---------------------------------------------------------------------------
# Windows signing (SSL.com eSigner)
# ---------------------------------------------------------------------------

# Signs the Windows binary from a Linux job. eSigner keeps the key in SSL.com's
# HSM and CodeSignTool only ever sends it a hash, so nothing about signing a PE
# needs Windows, and a Linux container is easier to make reproducible than the
# shell runner's global state.
#
# ESIGNER_ENV selects the SSL.com sandbox (TEST) or the real service (PROD).
# TEST signs with a demo certificate under a "- Development" root that no
# Windows machine trusts; it exists so the pipeline can be exercised before
# the certificate order is issued. A release tag therefore refuses TEST — the
# result would look signed on the release page and be rejected on the desktop.
# Tags carrying -rc are allowed through so a candidate can prove the path.
#
# Manual on branches: it costs a round trip to SSL.com and there is nothing to
# gain from signing every branch build, but a change to the signing scripts
# can only be tested by running them.
sign-windows-x86_64:
  stage: sign
  # Not the toolchain image: it carries no Java. Pinned by digest like
  # TOOLCHAIN_IMAGE, because this job handles the signing credentials.
  image: eclipse-temurin@sha256:5726444f65e67c407bac4ff1e036b475051f50bb3840273e81814e77c6fa8ee3
  tags: [linux, x86_64]
  needs:
    - build-windows-x86_64
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends osslsigncode curl unzip ca-certificates openssl
  script:
    # Protected variables are withheld on unprotected branches, and the
    # script's own "not set" message does not say why.
    - |
      if [ -z "${ESIGNER_ENV:-}" ]; then
        echo "ESIGNER_ENV is not set. If the ESIGNER_* variables are protected, this ref must be protected too." >&2
        exit 1
      fi
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$ESIGNER_ENV" != "PROD" ]; then
        case "$CI_COMMIT_TAG" in
          *-rc*) echo "release candidate: signing with ESIGNER_ENV=$ESIGNER_ENV" ;;
          *) echo "release tag $CI_COMMIT_TAG requires ESIGNER_ENV=PROD, got $ESIGNER_ENV" >&2; exit 1 ;;
        esac
      fi
    - ./scripts/sign-windows.sh dist/quip-node-manager-windows-x86_64.exe
    - ./scripts/verify-windows-signing.sh dist/quip-node-manager-windows-x86_64.exe
  artifacts:
    expire_in: 30 days
    paths:
      - dist/quip-node-manager-windows-x86_64.exe
  rules:
    - if: $CI_COMMIT_TAG
    # Same trigger set as build-windows-x86_64, so `needs` always finds it.
    - if: $CI_COMMIT_BRANCH
      changes:
        - src/**/*
        - src-tauri/**/*
        - package.json
        - bun.lock
        - scripts/sign-windows.sh
        - scripts/verify-windows-signing.sh
      when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Release (tags only)
# ---------------------------------------------------------------------------

release-binaries:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-macos-universal
    - build-linux-x86_64
    - sign-windows-x86_64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
    # Extract release notes: everything from top of CHANGELOG.md up to
    # the second "## v" heading (install instructions + current version).
    # Strip the leading "# Changelog" title line.
    - |
      DESCRIPTION=$(awk '
        /^## v/ { n++ }
        n >= 2  { exit }
        { print }
      ' CHANGELOG.md | tail -n +2)
    # Point the install one-liners at this tag instead of the main branch, so
    # the release page installs the released version, not the tip of main.
    - DESCRIPTION=$(printf '%s\n' "$DESCRIPTION" | sed "s#/-/raw/main/#/-/raw/${CI_COMMIT_TAG}/#g")
    - |
      release-cli create --name "$CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$DESCRIPTION" \
        --assets-link='{"name":"macOS Universal DMG","url":"'"${CI_PROJECT_URL}"'/-/jobs/artifacts/'"${CI_COMMIT_TAG}"'/raw/dist/quip-node-manager-macos-universal.dmg?job=build-macos-universal","link_type":"package"}' \
        --assets-link='{"name":"Linux x86_64 AppImage","url":"'"${CI_PROJECT_URL}"'/-/jobs/artifacts/'"${CI_COMMIT_TAG}"'/raw/dist/quip-node-manager-linux-x86_64.AppImage?job=build-linux-x86_64","link_type":"package"}' \
        --assets-link='{"name":"Linux x86_64 deb","url":"'"${CI_PROJECT_URL}"'/-/jobs/artifacts/'"${CI_COMMIT_TAG}"'/raw/dist/quip-node-manager-linux-x86_64.deb?job=build-linux-x86_64","link_type":"package"}' \
        --assets-link='{"name":"Windows x86_64 exe","url":"'"${CI_PROJECT_URL}"'/-/jobs/artifacts/'"${CI_COMMIT_TAG}"'/raw/dist/quip-node-manager-windows-x86_64.exe?job=sign-windows-x86_64","link_type":"package"}'
