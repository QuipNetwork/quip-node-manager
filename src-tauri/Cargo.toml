[package]
name = "quip-node-manager"
version = "0.2.1-rc10"
description = "Quip Node Desktop Manager"
authors = []
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "quip-node-manager"

[lib]
name = "quip_node_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables right-click → Inspect in release builds too (not just
# debug). Kept on through the rc series to debug platform-specific UI issues;
# revisit for GA.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
hex = "0.4"
# Read-only substrate storage-key hashing for the health monitor
# (twox128 / blake2_128_concat). The two u64 values decode with stdlib
# from_le_bytes, so no SCALE-codec crate is needed. No signing.
twox-hash = "2.1"
blake2 = "0.10"
dirs = "5"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
tauri-plugin-opener = "2.5.3"
tauri-plugin-notification = "2"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
