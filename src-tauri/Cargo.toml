[package]
name = "quip-node-manager"
version = "0.2.0-rc6"
description = "Quip Node Desktop Manager"
authors = []
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "quip-node-manager"

[lib]
name = "quip_node_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables right-click → Inspect in release builds too (not just
# debug). Kept on through the rc series to debug platform-specific UI issues;
# revisit for GA.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
hex = "0.4"
dirs = "5"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
tauri-plugin-opener = "2.5.3"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
